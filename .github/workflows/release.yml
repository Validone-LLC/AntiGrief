# Runs when a version tag is pushed (git tag v1.0.0 && git push origin v1.0.0):
# builds the zip with scripts/package.sh, publishes a GitHub release with the
# zip and that version's CHANGELOG section, and posts it to the Discord
# #releases channel. Ordinary commits and merges post nothing.
#
# The Discord step needs the repository secret DISCORD_RELEASES_WEBHOOK (the
# channel's webhook URL); without it that step skips quietly.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the TOC version
        id: version
        run: |
          toc="$(sed -n 's/^## Version:[[:space:]]*//p' AntiGrief.toc | tr -d '\r' | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$toc" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match '## Version: $toc' in AntiGrief.toc" >&2
            exit 1
          fi
          echo "version=$toc" >> "$GITHUB_OUTPUT"

      - name: Build the zip
        id: zip
        run: echo "path=$(bash scripts/package.sh HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract this version's changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The lines under "## <version>" up to the next "## " heading
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.zip.outputs.path }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "AntiGrief $GITHUB_REF_NAME" --notes-file notes.md

      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_RELEASES_WEBHOOK is not set; skipping."
            exit 0
          fi
          # Name and avatar come from the webhook's own settings in Discord
          # (a raw.githubusercontent.com avatar wouldn't load from a private repo)
          jq -n --arg repo "$REPO" --arg tag "$TAG" --rawfile notes notes.md '{
            embeds: [{
              title: ("AntiGrief " + $tag + " released"),
              url: ("https://github.com/" + $repo + "/releases/tag/" + $tag),
              color: 14096665,
              description: ($notes | .[0:3900]),
              footer: { text: $repo }
            }]
          }' > payload.json
          curl -fsS -H "Content-Type: application/json" -d @payload.json "$WEBHOOK"
